name: APSIM Phase 3 one-season forecast irrigation

on:
  push:
    branches: [clover-phase3-one-season]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  one-season-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install forecast and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip
          pip install 'herbie-data>=2025.3.0' pandas numpy xarray cfgrib eccodes s3fs

      - name: Prepare official APSIM sugarcane example
        run: |
          mkdir -p phase3/run
          curl -L --fail -o phase3/run/Sugarcane.apsimx https://raw.githubusercontent.com/APSIMInitiative/ApsimX/master/Examples/Sugarcane.apsimx
          curl -L --fail -o phase3/run/AU_Ingham.met https://raw.githubusercontent.com/APSIMInitiative/ApsimX/master/Examples/WeatherFiles/AU_Ingham.met
          python phase3/prepare_baseline.py

      - name: Pull APSIM Docker image
        run: docker pull apsiminitiative/apsimng:latest

      - name: Run no-forecast irrigation baseline
        run: |
          docker run --rm -v "$PWD/phase3/run:/test-run" apsiminitiative/apsimng:latest /test-run/Sugarcane_phase3_baseline.apsimx --csv --verbose

      - name: Identify baseline irrigation decision dates
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p = Path('phase3/run/Sugarcane_phase3_baseline.Report.csv')
          df = pd.read_csv(p)
          df['Clock.Today'] = pd.to_datetime(df['Clock.Today'])
          s = df[(df['Clock.Today'] >= '2000-07-01') & (df['Clock.Today'] <= '2000-09-07')].copy()
          events = s[s['AppliedToday'] > 0].copy()
          cols = ['Clock.Today', 'AppliedToday', 'TopSWC', 'TopSWdeficit',
                  'Sugarcane.swdef_photo', 'Sugarcane.biomass', 'Sugarcane.cane_wt', 'Sugarcane.sucrose_wt']
          cols = [c for c in cols if c in events.columns]
          events[cols].to_csv('phase3/run/baseline_irrigation_events.csv', index=False)
          print('Baseline events:', len(events))
          print(events[cols].to_string(index=False))
          print('Total baseline irrigation:', events['AppliedToday'].sum())
          PY

      - name: Retrieve historical GEFS forecasts for one season
        run: python phase3/fetch_season_gefs.py

      - name: Build forecast-aware and perfect-information scenarios
        run: python phase3/build_decision_scenarios.py

      - name: Run forecast-aware irrigation strategy
        run: |
          docker run --rm -v "$PWD/phase3/run:/test-run" apsiminitiative/apsimng:latest /test-run/Sugarcane_phase3_forecast.apsimx --csv --verbose

      - name: Run perfect-information irrigation benchmark
        run: |
          docker run --rm -v "$PWD/phase3/run:/test-run" apsiminitiative/apsimng:latest /test-run/Sugarcane_phase3_perfect.apsimx --csv --verbose

      - name: Analyse one-season results
        run: python phase3/analyse_one_season.py

      - name: Preview summary
        run: |
          echo '--- strategy summary ---'
          cat phase3/run/phase3_one_season_summary.csv
          echo
          echo '--- forecast-aware decisions ---'
          cat phase3/run/forecast_aware_decision_days.csv

      - name: Upload complete Phase 3 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-phase3-one-season
          path: |
            phase3/run/*.csv
            phase3/run/*.json
            phase3/run/*.apsimx
          if-no-files-found: error
